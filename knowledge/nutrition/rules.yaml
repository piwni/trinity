# Trinity nutrition rulebook — PARAMETERIZED.
#
# `analysis/nutrition.py` loads this to turn daily Fitatu totals + training load
# into provenance-tagged adequacy flags. Like the training/readiness rulebooks,
# every threshold is a concrete number so the math stays deterministic and the
# agent (nutritionist skill) only does judgment on top of the computed digest.
#
# Numbers are conservative, endurance-athlete-aware defaults with sources cited.
# Sex/age-specific values: where the athlete's sex is unknown we apply the male
# default and say so in the digest `missing` list.
schema_version: 1

# --- Energy availability (EA) — the RED-S / LEA gold-standard screen ----------
# EA = (energy intake kcal - exercise energy expenditure kcal) / fat-free mass.
# Ref: Loucks; Mountjoy et al., IOC consensus on Relative Energy Deficiency in
# Sport (RED-S). Bands are kcal per kg FFM per day.
energy_availability:
  optimal_min: 45        # >=45 supports adaptation + health
  reduced_min: 30        # 30-45 = reduced (subclinical), amber
  low_below: 30          # <30 = clinically low EA, red (RED-S risk)
  # When FFM is unknown we use body weight as the denominator (over-estimates
  # FFM, so EA reads slightly LOW vs the true per-FFM figure). Flagged as a caveat.

# --- Energy balance (intake vs total daily expenditure) ----------------------
# TDEE = BMR * resting_activity_factor + exercise kcal + thermic effect of food.
energy_balance:
  # Physical activity level for everything that is NOT logged training — sleep,
  # work, chores, fidgeting. Training kcal are added separately on top, so this
  # must NOT be one of the usual Harris-Benedict multipliers (those already
  # bundle exercise in). Reference non-exercise PAL bands: 1.2 is bed rest, a
  # genuinely sedentary lifestyle is 1.4-1.5, a job spent on your feet is
  # 1.7-1.9. The previous 1.2 default understated a normal day by ~400 kcal and
  # manufactured an implausible energy surplus for every athlete.
  bmr_resting_activity_factor: 1.6
  thermic_effect_of_food_pct: 10     # ~10% of intake
  surplus_amber_pct: 15              # chronic >|15%| off balance worth noting
  deficit_amber_pct: 15

# --- Carbohydrate periodization by that day's training load (g/kg body mass) --
# Ref: Burke et al., "Carbohydrates for training and competition"; ACSM/IOC.
# Tier is chosen by the day's COMBINED TSS (falls back to training hours).
carbohydrate:
  tiers:
    rest:       { max_tss: 30,  min_g_per_kg: 3,  max_g_per_kg: 5 }   # rest / recovery
    moderate:   { max_tss: 80,  min_g_per_kg: 5,  max_g_per_kg: 7 }   # ~1h moderate
    high:       { max_tss: 150, min_g_per_kg: 6,  max_g_per_kg: 10 }  # intense / ~1-3h
    very_high:  { max_tss: null, min_g_per_kg: 8, max_g_per_kg: 12 }  # >3h / race-like
  # "Hard/long" fueling check: on key-session days carbs must reach the tier min.
  key_session_tss: 80

# --- Protein (g/kg body mass/day) --------------------------------------------
# Ref: Morton et al. meta-analysis; ISSN position stand. Endurance + strength.
protein:
  min_g_per_kg: 1.6
  optimal_min: 1.6
  optimal_max: 2.2
  per_meal_g_per_kg: 0.3   # informational; meal timing not in Fitatu export

# --- Fat (floor for hormonal health) -----------------------------------------
fat:
  min_g_per_kg: 0.8
  saturated_pct_energy_max: 10   # WHO/AHA

# --- Diet quality / health caps ----------------------------------------------
diet_quality:
  sugars_pct_energy_max: 10      # WHO free-sugars guidance (proxy: total sugars)
  fibre_g_min: 30                # adult adequate intake
  alcohol_drinks_per_day_amber: 2
  alcohol_drinks_per_week_amber: 7

# --- Caffeine ----------------------------------------------------------------
caffeine:
  daily_mg_amber: 400            # EFSA adult upper habitual
  daily_mg_red: 600
  # Timing vs sleep can't be computed (no clock times in export) — noted, not flagged.

# --- Micronutrient reference daily intakes (sums averaged over the window) ----
# male adult RDA/AI defaults, athlete targets noted where higher. Ref: US DRI / EFSA.
micronutrients:
  iron_mg:      { target: 8,    athlete_target: 11,   unit: mg }   # female RDA 18 (note)
  calcium_mg:   { target: 1000, athlete_target: 1000, unit: mg }
  magnesium_mg: { target: 400,  athlete_target: 400,  unit: mg }
  potassium_mg: { target: 3500, athlete_target: 3500, unit: mg }
  zinc_mg:      { target: 11,   athlete_target: 11,   unit: mg }
  vitamin_c_mg: { target: 90,   athlete_target: 90,   unit: mg }
  vitamin_d_ug: { target: 15,   athlete_target: 25,   unit: ug }
  sodium_mg:    { target: 1500, athlete_target: 1500, unit: mg, upper: 2300 }
  omega3_g:     { target: 1.6,  athlete_target: 1.6,  unit: g }
  # flag a micronutrient when window mean < this fraction of the (athlete) target.
  deficiency_fraction: 0.7

  # Above this share of reference-supplied values, a shortfall stops being
  # reportable as one. The asymmetry is deliberate and is about consequences, not
  # statistics: telling an athlete to supplement on the strength of a number we
  # mostly looked up in a table is the expensive error, while an estimate that
  # comfortably CLEARS the target would need the tables to be wrong by tens of
  # percent, and all in the same direction, to be misleading. So a heavily
  # imputed nutrient can still report "adequate", but never "deficient" — it
  # reports "unknown" and asks for a blood test instead.
  imputed_ceiling: 0.5

  # A logged ZERO that a reference food table contradicts by at least this much
  # (nutrient's own unit, for that one portion) is treated as a missing value and
  # replaced. A wrong zero is more dangerous than a blank: the coverage machinery
  # can see a blank, but a zero looks exactly like a real measurement and drags
  # the mean down silently. Grated hard cheese logged at 0 mg calcium is the
  # archetype. Floors are set high enough that rounding noise in a reference
  # table -- a few mg of calcium in sugar -- never triggers an override.
  # Nutrients absent from this list have blanks filled but zeros left alone.
  zero_override_floor:
    calcium_mg:   20
    iron_mg:      0.5
    magnesium_mg: 10
    potassium_mg: 50
    zinc_mg:      0.5
    vitamin_c_mg: 2
    fibre_g:      0.5
  # Fitatu's food database leaves most micronutrient cells blank, and a blank is
  # not a zero. A nutrient supplied by fewer than this fraction of logged FOOD
  # ITEMS has an understated mean, so it is reported "unknown" rather than
  # deficient. Measured per item, never per day: one item out of ~17 is enough to
  # make a daily total non-zero, so a day-level test always reads ~100%.
  coverage_floor: 0.5

# --- Recovery-correlation reporting ------------------------------------------
# Associations between prior-day nutrition and next-day recovery (HRV/RHR/sleep)
# and same-day caffeine/alcohol. Observational only — never causal.
correlation:
  min_samples: 14                # below this we don't report an association
  notable_abs_r: 0.25            # |r| at/above this clears the STRENGTH bar
  # Confounders regressed out before judging an association. Intake tracks
  # training load and load depresses next-morning recovery on its own, so an
  # unadjusted coefficient measures load wearing a nutrition costume.
  control_for: [tss]
  # Strength alone is not enough to call something notable — a coefficient says
  # nothing about how far the outcome actually moves. An association must ALSO
  # shift the outcome (p10 -> p90 of the driver) by more than the larger of:
  #   * the athlete's own smallest worthwhile change, 0.5 x SD of that outcome; and
  #   * the absolute floor below, in the outcome's own units.
  # The absolute floor is what makes the gate bite. On its own the SWC is
  # self-referential — the effect scales with SD(outcome) and so does the SWC, so
  # an SWC-only test reduces to |r| >= 0.2, weaker than notable_abs_r above.
  materiality_floor:
    hrv_rmssd_ms: 3.0      # ~1 night's normal scatter; below this is noise
    resting_hr_bpm: 2.0    # within the beat-to-beat + measurement error band
    sleep_hours: 0.5       # half an hour; finer than the sleep tracker resolves
