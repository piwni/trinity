risk_note: >
  (1) The stretch targets rest on an unmeasured CdA ~0.03-0.04 below every disc fit:
  the autumn aero test decides whether 8:50 is a target or a hope. (2) Fueling is
  the number-one race risk; the 5 h gut validation in weeks 46-48 and the mandatory
  in-race rescue exist because of Wolsztyn. (3) Mechanical: a Di2 failure already
  ended one A race. (4) Cold-water swim: 1:20-1:22 demonstrated at Malbork. (5) Run
  durability: these paces sit on 35-45 km/week of history, so tissue before speed.
  (6) June 2027 density: Sieraków, the HM and Mietków inside 22 days; Mietków is
  kept with no target and a bike cap, so its race-day form sits above the C band.
  (7) Qualification: Hamburg is the single attempt (athlete decision).

trajectory_note:
  - "Full: 10:27:00 (Malbork 2025, official) -> DNF (2026, mechanical) -> 9:17 planning / 8:50 stretch at Malbork 2027 -> 9:07 planning / 8:40 stretch at Hamburg 2028."
  - "Half: 4:45:56 Sieraków (official) / 4:24:05 Syców (2026) -> 4:38:21 Wolsztyn (GI failure) -> 4:25 / 4:21 planning (4:20 / 4:15 stretch) in 2027."
  - "Run: 1:18:00 half in 2026 (near-maximal, 7 days after a 70.3) -> 10 km measurement Nov 2026 -> 1:17 planning / 1:15 stretch HM in 2027 (training race)."
  - "FTP (4iiii): 250 W planning now (255 stretch) -> 258 W by Malbork (265) -> 265 W by Hamburg (275)."
  - "CdA (effective, corrected model): 0.245 Malbork 2025 no aero; 0.220-0.239 disc 70.3s in 2026 -> 0.232 / 0.225 planning; 0.194 / 0.185 needed for the stretch targets."

