# Season spec -- Wolsztyn 70.3 (raced 2026-09-19) -> 2027 race season -> Castle
# Triathlon Malbork full (2027-09-05, A) -> IRONMAN Hamburg (2028-06-04, A).
#
# Two columns everywhere: PLANNING values drive every watt, pace, IF check and
# race TSS; STRETCH values (8:50 Malbork, 8:40 Hamburg) are labels. See
# meta.planning_vs_stretch. Bike splits: data/context/spec_gen/projections.py.
# Consistency is enforced by `trinity build-plan` (spec_lint: declared FTP/CdA values,
# fuel ceiling, split totals, calendar references, the dated facts in facts.yaml).
#
# Unpublished dates (assumed from the 2026 pattern): Syców 2027-07-11, Malbork
# 2027-09-05, Mietków 2027-06-19 (if it lands on 12 Jun it collides with the
# HM: race the HM, skip Mietków), IRONMAN Hamburg 2028-06-04, Kona 2028 date
# not announced (2028-10-14 assumed). Tune-up 70.3 2028-04-30: race not yet chosen.

