  ftp_w: 250                    # PLANNING FTP. Tested 29 Sep 2026: 249 W indoors (stretch 255 unsupported)
  run_threshold_s_per_km: 215   # PLANNING 3:35/km until the spring 2027 10 km test (stretch 212)
