    ftp_w: [236, 245, 247, 249, 250, 255, 256, 257, 258, 260, 262, 265, 275, 280]
    cda: [0.185, 0.194, 0.198, 0.216, 0.225, 0.226, 0.232,
          0.220, 0.237, 0.239, 0.245, 0.252]
    fuel_ceiling_g_per_h: 95
  planning_vs_stretch:
    - { input: "FTP now (4iiii)",       planning: "250 W", stretch: "255 W", note: "Tested 29 Sep 2026: 20 min at 261.7 W indoors -> FTP 249 W. Confirms 250; 255 is not supported" }
    - { input: "FTP at Malbork",        planning: "258 W", stretch: "265 W", note: "+8-10 W/yr in a third long-course season" }
    - { input: "FTP at Hamburg",        planning: "265 W", stretch: "275 W", note: "" }
    - { input: "CdA Malbork (effective)", planning: "0.232", stretch: "~0.194 needed", note: "Disc fits 0.220-0.239; Malbork 2025 no-aero 0.245. 8:50 needs a position change, not a wheel" }
    - { input: "CdA Hamburg (effective)", planning: "0.225", stretch: "~0.185 needed", note: "Planning assumes a year of position work (-0.007)" }
    - { input: "Run threshold",         planning: "215 s/km (3:35)", stretch: "212 s/km (3:32)", note: "A 10 km test in spring 2027 decides" }
    - { input: "Malbork swim 3.8 km",   planning: "1:12", stretch: "1:09", note: "Demonstrated here: 1:20:08 (2025), 1:22 (2026). 1:09 gated on a <2:00/100 cold swim" }
    - { input: "IM marathon (Malbork)", planning: "3:04 (4:22/km)", stretch: "3:00 (4:16/km)", note: "" }
    - { input: "Malbork total",         planning: "9:17", stretch: "8:50", note: "Held as the optimistic stretch" }
    - { input: "Hamburg total",         planning: "9:07", stretch: "8:40", note: "Qualifying line on 2026 data is ~9:21 (M40-44), see qualifying note" }
  demonstrated_vs_modelled:
    - { what: "Demonstrated full distance (Malbork 2025, official)", total: "10:27:00", legs: "1:20:08 / 5:19:29 / 3:46:48 (device legs, 170 W NP, no aero)" }
    - { what: "Athlete self-assessment today (not raced)", total: "9:10", legs: "1:10 / 4:45 / 3:10 -- the 4:45 at 190 W implies CdA 0.198" }
    - { what: "Model at today's planning inputs", total: "~9:29", legs: "1:15 / 4:59 / 3:10 + 5' T -- FTP 250 (190 W), CdA 0.232" }
    - { what: "Malbork 2027 planning", total: "9:17", legs: "1:12 / 4:56 / 3:04 + 5' T" }
    - { what: "Malbork 2027 stretch", total: "8:50", legs: "1:09 / 4:37 / 3:00 + 4' T" }
    - { what: "Hamburg 2028 planning / stretch", total: "9:07 / 8:40", legs: "1:10 / 4:51 / 3:02 -- 1:07 / 4:30 / 2:59" }
  data_todos:
    - "4iiii: left-only or dual-sided? If left-only, every power-fade figure (incl. Malbork 2025's 12.2%) carries an L/R-balance caveat."
    - "Wolsztyn 2026 actual intake: g/h CHO on bike and run, ml/h fluid, products, air temperature. Until then 'gels on the bike' is a hypothesis."
    - "Wolsztyn 2026 swim: which HR sensor (wrist optical vs chest strap)?"
    - "Syców swim course length: 34:00 is 1:47/100 over 1.9 km, faster than pool CSS; athlete reports ~1:50/100."
    - "Kona qualifying cut-off: re-pull the IRONMAN Hamburg performance-pool line after the 2027 race (2026: age-graded 9:03:44, media-reported)."
    - "Fat-free mass: state how it is measured before any energy-availability figure is used."
    - "23 Aug 2026 run: the file says 30.0 km at 4:50/km moving; the athlete recalls ~4:40/km. Reconcile against the activity."
    - "Wolsztyn official splits: device legs sum to the official 4:38:21 only with the 1:34:48 run leg (1:34:26 is moving time). Confirm on the results page."
  calibration_note: >
    TESTED FTP is 249 W (29 Sep 2026, indoors on the KICKR in resistance mode, paced
    off the 4iiii: best 20 min 261.7 W x 0.95). PLANNING stays 250 W, since 1 W is
    inside the meter's noise, and the 255 W stretch reading is not supported. The IF
    cap uses the tested 249 W, which is 189 W today. The meter is self-consistent --
    ERG blocks read ~200 W against a 200 W target -- but that only shows ERG control
    works: its absolute accuracy is untested, and it may be left-only (data TODO).
    The test series is INDOORS from here, on this same setup (resistance or passive
    mode, never ERG, same warm-up), because an indoor number reads differently from
    an outdoor one and mixing them breaks the trend. One OUTDOOR 20-min TT each
    spring (weeks 27 and 81, same road segment) cross-checks the series and is kept
    out of the indoor trend. No ramp tests. IRONMAN race watts = the lower of
    IF 0.76 x the latest tested FTP and the highest power that has passed the
    durability gate (outdoor 4 h ride, 3x40' at that power, power fade <5% and
    Pw:HR drift <5%). Never buy a bike split with intensity: it trades ~5 bike
    minutes for ~15 run minutes. The intervals.icu FTP setting (280 W) is ~10% high:
    set it to 249 W and run threshold to 3:35/km so platform TSS, IF and CTL are honest.
  aero_note: >
    Every CdA here is EFFECTIVE CdA in 4iiii watts from one model (`trinity aero`):
    station wind at 10 m scaled x0.65 to rider height; headwind per 1 km segment
    from the course's actual bearing (v cos theta); measured course length; and the
    SAME air density, rolling resistance and drivetrain loss for the fit and the
    prediction (rho 1.20, Crr 0.0045, eta 0.975, 83 kg system). Race-time fits: Malbork
    2025 0.245 and Mietków 2026 0.252 (no aero); Sieraków 2026 0.237, Syców 2026
    0.239 (meter failed; at an assumed 225 W) and Wolsztyn 2026 0.220 (disc). The
    earlier 0.158-0.210 fits were biased low: that model charged all climbing as lost
    energy, split every course half into the wind, and dropped ~4% of Syców's
    distance. Disc plus deep front is worth 0.010-0.020 against training wheels; add
    0.003-0.008 over 4.5 h for position decay and sitting up to drink. PLANNING: CdA
    0.232 Malbork, CdA 0.225 Hamburg, CdA 0.226 for the 70.3s. The stretch targets need
    CdA 0.194 (8:50, at 201 W) and CdA 0.185 (8:40, at 209 W) -- 0.03-0.04 below every
    disc fit so far, which is a position change, not equipment. The athlete's own 4:45
    current-fitness bike implies CdA 0.198, so 8:50 and his self-assessment rest on the
    same unmeasured number. FIRST AERO TEST in weeks 4-10, first calm day: Chung
    virtual-elevation on a closed loop, >=6 laps at two speeds, race kit and race
    bottles. Then every spring and autumn.
  run_note: >
    PLANNING threshold 215 s/km (3:35/km); 212 is the stretch reading. The 1:18:00
    half of 2026-06-06 averaged HR 160 against LTHR 165 for 78 minutes -- 97% of LTHR,
    a near-maximal effort. HR was 164 by km 17 at 3:45-3:50/km; the 3:25 last km
    shows neuromuscular reserve, not aerobic reserve. The genuine mitigating fact:
    it was run 7 days after Sieraków 70.3. Fresh estimate 1:16:30-1:17:15. A 10 km
    test in spring 2027, run all-out, decides it: ~34:30 -> 212, ~35:00 -> 215, 35:25 or slower
    -> 218; every pace is re-derived from the result. The strongest durability
    evidence in the file is 22 Aug 2026: 27.2 km at 4:25/km (HR 147->150, 0.7% pace
    fade) run as a BRICK off a 4:30 indoor ride (3x40' at a 200 W target, the rest
    ~160 W; ride NP ~175-180 W, IF ~0.70), then 30 km easy Z2 the next morning. The
    caveat that goes with it: race load is ~IF 0.76 for 4:40+ after a 3.8 km swim
    (~25-30% more bike stress), and km 28-42 have not been run off a bike since
    Malbork 2025. Wolsztyn's run course is closer to a trail run than a road half and
    was run on a failed gut, so it is not a calibration point.
  swim_note: >
    PLANNING Malbork swim 1:12. The 1:09 stretch opens only after one swim under
    2:00/100 over >=2 km in <=18 C water before week 46. Demonstrated at this venue:
    1:20:08 (2025) and 1:22 (2026, 17.2 C), so 1:09 is an 11-13 minute gain -- the
    biggest per-leg ask in the plan. The working hypothesis is cold/open-water skill
    rather than pool fitness, and it gets TESTED: a 1500 m TT in the pool and a
    1500 m TT in open water in the same week, RPE logged, to separate cold/OW skill
    from sighting, wetsuit restriction, start anxiety and course length. (Wolsztyn's
    swim HR of 110 is not evidence either way: swim HR runs 10-15 bpm below run HR at
    equal effort and wrist optical HR in water is unreliable -- sensor TODO.)
    Cold-shock habituation: 6 immersions of 3-5 min at 10-15 C in October 2026 and
    April 2027, repeated October 2027 and April 2028. The three race-temperature
    swims in the last 3 weeks before each IM are familiarisation, not adaptation.
    Open water whenever it is >=14 C. The Alster in early June is 16-19 C: none of
    the Hamburg swim gain is a warm-water gain.
  testing_note: >
    Bike tests: week 4 done (FTP 249 W, indoors). Then indoors in weeks 17, 46, 56,
    69, and outdoors once each spring (weeks 27 and 81) as a cross-check kept out of
    the indoor trend. Same warm-up throughout; swim 400 m + 200 m CSS in the same
    weeks. Run: no 10 km in November 2026 (Web
    Summit). First 10 km test in spring 2027 (week 31, the pre-Malbork run
    diagnostic), then a 10 km or 5 km TT in weeks 57, 65 and 74. Aero: Chung test in weeks 4-10, then every spring
    and autumn. Pool vs open-water 1500 m TT pair in the first OW weeks of 2027.
    Durability gate (outdoor 4 h, 3x40' at race watts): weeks 46-48 and 84-86.
    Re-derive every watt and pace after each round.
  loading_note: >
    Cadence is 4:1 -- four load weeks, then a recovery valley at >=40% lower load --
    in every base and threshold block. The exceptions are deliberate: 2:1 into the
    two holiday weeks (16, 68), and the race-structured summers, where races and
    their recovery days replace valleys. The validator excludes race weeks and
    post-race days from the ramp baseline.
  fueling_note: >
    Wolsztyn 2026: GI distress from km 3 of the run after gels on the bike; the gut
    'unlocked' around km 18, i.e. ~70 minutes of little absorption. Actual Wolsztyn
    intake is not recorded yet (data TODO); if it was <=60 g/h, this plan RAISES gut
    load, deliberately and progressively: 60 g/h (autumn) -> 75 (winter) -> 85
    (spring) -> 85-95 g/h on the bike in the IM blocks, 60-75 g/h on brick runs.
    Ceiling 95 g/h. CARBOHYDRATE AND FLUID ARE SET SEPARATELY: one concentrated 1:0.8
    glucose:fructose bottle (or hydrogel) plus plain water bottles, so g/h does not
    depend on ml/h. Gels on the run are fine and stay. FLUID = 60-80% of measured
    sweat rate for the conditions, and never finish a session heavier than you
    started; until two sweat tests are done, 500-800 ml/h and drink to thirst above
    that. Sodium 600-800 mg/L. LONG-GUT VALIDATION before Malbork: one 5 h outdoor
    ride at 85-95 g/h in race-morning conditions in weeks 46-48, GI-scored -- Syców's
    2:15 bike does not validate 4:40 of intake. Last 30' of every race-sim ride is
    fluid only, then fuel the brick. No new product inside 6 weeks of an A race.
    FALLBACK LADDER (GI score >=3 at Syców, the weeks 46-48 ride or the tune-up drops
    one rung for good): (1) 75 g/h, one CHO bottle plus water; (2) first 2 h
    semi-solid, liquid after; (3) hydrogel for the last hour only; (4) a 60 g/h floor
    with full fluid and sodium. IN-RACE RESCUE IS MANDATORY: at the first sign of the
    Wolsztyn pattern stop carbohydrate for 10', water or cola only, walk one aid
    station, resume at 30 g/h and build back. At IM distance the same failure after
    4:40 of bike intake leaves 25+ km to run in deficit. Caffeine <=3 mg/kg, first
    dose >=90' into the bike, never from a new source.
  durability_note: >
    Measured by `trinity durability` from raw streams: Pa:Hr for runs, Pw:Hr for
    rides, plus pace/power FADE, which catches the failure decoupling misses (output
    and HR falling together). The fuel-failure signature fires on 6 sessions,
    including Wolsztyn's run. Power fade cannot be measured on ERG, where power is
    held by construction, so the 32 indoor rides report decoupling only and every
    fade target is ridden OUTDOORS (or indoors in level/resistance mode). If the
    4iiii is left-only, part of any power fade -- including Malbork 2025's 12.2%
    (176 -> 154 W) -- may be L/R balance shifting with fatigue. TARGETS: bike power
    fade <5% and Pw:HR drift <5% on the 4 h 3x40' gate ride (weeks 46-48, 84-86);
    run pace fade <3% on the long IM-pace brick.
  equipment_note: >
    Disc plus deep front is worth 0.010-0.020 of CdA; the rest of the stretch gap is
    position, which is why the aero test comes first. MECHANICAL PROTOCOL (a Di2
    failure ended the 2026 A race): drivetrain service 3 weeks before every A/B race;
    Di2 at 100% within 72 h with charge cycles logged; 60' shakedown 48 h out with 30
    shifts under load; junction box and wires checked after every transport; know
    what the rear derailleur defaults to on battery or wire loss. Zero-offset the
    4iiii before every race and recalibrate after any workshop visit. Before 2028,
    moving the TT bike to mechanical or SRAM AXS is worth more than any aero gain.
  heat_note: >
    Only if a Kona slot is taken: 8 weeks of post-run sauna (30', 4x/week) plus
    10-14 days on the island; book leave and travel in June 2028. For Hamburg itself,
    optional sauna from week 83 for plasma volume.
  body_comp_note: >
    73 kg at 184 cm. Target 71 kg by week 30, then HOLD (week 74 checkpoint: 71 kg).
    71 kg at the same power is worth ~1.5-2.5 min over an IM marathon. Tighten
    non-training intake only; sessions stay fully fuelled (85-95 g/h in the IM
    blocks). Energy availability cannot be read from the Fitatu ratios: it depends on
    absolute intake and exercise energy, the log is off by ~281 kcal/day, and the
    fat-free-mass method is not stated (TODO). g/kg macros are reported but are
    inflated if intake is over-logged.
  qualifying_note: >
    From 2026 the World Championship is Kona only: one day, men and women together.
    The 2028 date is not announced (early-mid October assumed). Slots at a qualifier:
    each age group's winner (rolling to 2nd, then 3rd), then a performance pool
    split by gender and ranked on age-graded time (finish x the Kona Standard
    factor: M40-44 0.9683, M35-39 0.9895 in the 2027 cycle, updated each August). Age
    group = age on 31 December of the qualifying year: M40-44 at Hamburg 2028, but
    M35-39 at any 2027 race. Hamburg 2026 reference (media-reported, not official):
    60 age-group slots, 44 to men; the last male pool slot went at age-graded
    9:03:44, a 9:21:32 M40-44 finish. So the QUALIFYING LINE is about 9:20 raw, not
    8:40: the planning 9:07 clears it by ~14 min on 2026 numbers, and 8:40 is the
    stretch, not the requirement. Castle Triathlon Malbork is not IRONMAN-branded
    and awards no slots, so Hamburg is the single qualifying attempt. Athlete
    decision (2026-09-24): keep Malbork and accept that; no backup IRONMAN.
  rationale: >
    Wolsztyn 2026 (4:38:21) was a fueling result, not a fitness one: the bike was
    correctly ridden (208 W NP = IF 0.83 on the planning 250 W FTP, VI 1.03, 4.3%
    decoupling in 15 km/h wind) and the run fell from 4:02/km to 5:03/km with HR
    FALLING -- no substrate, not an aerobic limit.

    Demonstrated full distance is 10:27:00 (Malbork 2025). The planning line for
    Malbork 2027 is 9:17 and for Hamburg 2028 is 9:07; 8:50 and 8:40 are held as
    optimistic stretch targets. Where the planning minutes come from, against 2025:
    swim 1:20 -> 1:12 (cold/OW skill; 1:09 would be 11-13 min), bike 5:19 -> 4:56
    (disc + deep front, FTP 245 -> 258 at the same IF 0.76), run 3:47 -> 3:04 (a
    weekly threshold session and 55-70 km/week instead of 35-45). The stretch lines
    additionally need CdA ~0.03-0.04 better, which only the aero test can confirm.

    2027 is a racing year on an honest engine: autumn strength, swim technique and
    threshold work into November, then winter threshold and VO2 runs, spring volume into Sieraków
    (B), then Syców (B) as the fueling dress rehearsal and seven IM-specific weeks
    into Malbork. Winter 2027-28 moves the emphasis to the limiters 2027 exposes:
    run volume and threshold, cold/open-water skill and gut capacity. Spring 2028 is
    IM-specific with a tune-up 70.3 five weeks out and a Mujika taper (>=40% off the
    peak over the final 14 days) -- the same shape as Malbork's.

    Swim >=3/week and run >=4/week throughout. Monday is a genuine rest day.

